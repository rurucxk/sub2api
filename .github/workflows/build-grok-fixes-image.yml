name: Build Grok fixes image

on:
  push:
    branches:
      - build/grok-fixes-0.1.161

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=0.1.161
            COMMIT=7f42f3cf
          tags: |
            ${{ steps.image.outputs.name }}:grok-fixes-0.1.161
            ${{ steps.image.outputs.name }}:grok-fixes-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
